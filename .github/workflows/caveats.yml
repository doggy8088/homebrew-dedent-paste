# cargo-dist pushes a freshly generated Formula/dedent-paste.rb on every
# dedent-paste release. That formula has no caveats, so this workflow re-adds
# the Karabiner-Elements reminder shown after `brew install`.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
name: Add Homebrew caveats

on:
  push:
    branches: [main]
    paths:
      - "Formula/*.rb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  caveats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add caveats block
        run: python3 scripts/add-caveats.py Formula/dedent-paste.rb

      - name: Check formula style
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew style Formula/dedent-paste.rb

      - name: Commit and push
        run: |
          if git diff --quiet -- Formula; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "chore: add Karabiner-Elements caveats to formula"
          git push
